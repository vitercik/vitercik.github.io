name: Visual site checks

on:
  pull_request:
    branches: [main, master]
    paths:
      - "_config.yml"
      - "_bibliography/**"
      - "_books/**"
      - "_data/**"
      - "_includes/**"
      - "_news/**"
      - "_pages/**"
      - "_posts/**"
      - "_teachings/**"
      - "assets/**"
      - "awards/**"
      - "robots.txt"
      - "test/visual/**"
      - ".github/workflows/visual-regression.yml"
      - "package.json"
      - "package-lock.json"
      - "Gemfile"
      - "Gemfile.lock"
  push:
    branches: [main, master]
    paths:
      - "_config.yml"
      - "_bibliography/**"
      - "_books/**"
      - "_data/**"
      - "_includes/**"
      - "_news/**"
      - "_pages/**"
      - "_posts/**"
      - "_teachings/**"
      - "assets/**"
      - "awards/**"
      - "robots.txt"
      - "test/visual/**"
      - ".github/workflows/visual-regression.yml"
      - "package.json"
      - "package-lock.json"
      - "Gemfile"
      - "Gemfile.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          npm ci
          sudo apt-get update
          sudo apt-get install -y imagemagick
          pip3 install nbconvert
          npx playwright install --with-deps chromium webkit

      - name: Check production routes, layout, and interactions
        run: npm run test:visual

      - name: Upload screenshots and browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-site-report
          path: output/playwright/
          if-no-files-found: ignore
